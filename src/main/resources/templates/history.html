<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #212529;
        }
        .navbar-brand, .navbar-text {
            color: #fff !important;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .page-title {
            font-size: 1.75rem;
            color: #212529;
            margin-bottom: 1.5rem;
        }
        .table-container {
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            padding: 1.5rem;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #212529;
            color: #fff;
            border-bottom: none;
            padding: 1rem;
        }
        .table tbody td {
            vertical-align: middle;
            padding: 1rem;
            border-bottom: 1px solid #dee2e6;
        }
        .table tbody tr:last-child td {
            border-bottom: none;
        }
        .table-striped>tbody>tr:nth-of-type(odd)>* {
            background-color: #f8f9fa;
        }
        .badge {
            font-weight: 500;
            padding: 0.4em 0.6em;
        }
        .text-success {
            color: #198754 !important;
            font-weight: 600;
        }
        .text-danger {
            color: #dc3545 !important;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/dashboard">Jagadguru Shri Shivarathreeshwara Bank</a>
            <div class="d-flex align-items-center ms-auto">
                <span class="navbar-text me-3" th:text="'Welcome, ' + ${user.username}">
                    Welcome, Abc
                </span>
                <form action="/logout" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-danger btn-sm px-3 py-1">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="page-title">Transaction History</h2>
        
        <div class="table-container">
            <table class="table table-striped table-borderless">
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Type</th>
                        <th scope="col">Details</th>
                        <th scope="col">Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${transactions}">
                        <td th:text="${#temporals.format(tx.date, 'dd-MM-yyyy HH:mm')}">23-01-2026 15:12</td>
                        <td><span th:class="${tx.type == 'CREDIT' ? 'badge bg-success' : 'badge bg-danger'}" th:text="${tx.type}">CREDIT</span></td>
                        <td th:utext="${tx.details}">Received from <strong>Xyz</strong></td>
                        <td th:class="${tx.type == 'CREDIT' ? 'text-success' : 'text-danger'}" th:text="${tx.type == 'CREDIT' ? '+ ₹ ' : '- ₹ '} + ${tx.amount}">+ ₹ 154.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="4" class="text-center text-muted py-4">No transactions found. Start transferring money!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
