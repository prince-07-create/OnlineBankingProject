<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #212529;
        }
        .navbar-brand, .navbar-text {
            color: #fff !important;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .balance-card {
            background-color: #0d6efd;
            color: white;
            border-radius: 0.375rem;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .balance-card .card-header {
            border-bottom: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            padding: 1rem 1.25rem;
        }
        .balance-amount {
            font-size: 2.2rem;
            font-weight: 500;
        }
        .quick-actions-card {
            border-radius: 0.375rem;
            border: 1px solid #dee2e6;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .quick-actions-card .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            padding: 1rem 1.25rem;
            color: #495057;
        }
        .action-btn {
            width: 100%;
            margin-bottom: 1rem;
            padding: 0.75rem;
            font-size: 1.05rem;
        }
        .action-btn:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/dashboard">JSS Bank</a>
            <div class="d-flex align-items-center ms-auto">
                <span class="navbar-text me-3" th:text="'Welcome, ' + ${user.username}">
                    Welcome, Abc
                </span>
                <form action="/logout" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-danger btn-sm px-3 py-1">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card balance-card">
                    <div class="card-header">
                        Account Balance
                    </div>
                    <div class="card-body p-4">
                        <div class="balance-amount mb-2">₹ <span th:text="${user.balance}">73.00</span></div>
                        <div>Savings Account</div>
                    </div>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card quick-actions-card">
                    <div class="card-header">
                        Quick Actions
                    </div>
                    <div class="card-body p-4">
                        <a href="/transfer" class="btn btn-outline-primary action-btn">Transfer Funds</a>
                        <a href="/history" class="btn btn-outline-secondary action-btn">View History</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
